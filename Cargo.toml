[package]
name = "ccorp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
dotenvy = "0.15.7"
reqwest = { version = "0.13.2", features = ["json", "rustls", "gzip", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
futures-util = "0.3.31"
async-stream = "0.3.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
minijinja = "2.15.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
